[project]
name = "math-worksheet"
version = "0.1.0"
description = "Generate random arithmetic worksheets (addition, subtraction, multiplication, division)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = []

[project.scripts]
math-worksheet = "math_worksheet.cli:main"

[project.optional-dependencies]
pdf = [
    "reportlab>=5.0.1",
]

[build-system]
requires = ["uv_build>=0.8.8,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pypdf>=6.19.0",
    "pytest>=9.1.1",
    "reportlab>=5.0.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
